<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guillaume Morissette</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 100'><text y='.9em' font-size='75' font-family='monospace'>✱</text></svg>">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="home.css">
</head>
<body class="home">

  <aside class="column">
    <div class="text-list">
       <div class="joke-item"><span class="txt">Guillaume Morissette</span><span class="detail"></span></div>
       <div class="joke-item"><span class="txt">Writer</span><span class="detail"></span></div>
       <div class="joke-item"><span class="txt">My Dog</span><span class="detail">› Hermit</span><img class="hover-img" src="dog-reference.jpg" alt="My dog" width="640" height="428"></div>
       <div class="joke-item"><span class="txt">Contact</span><span class="detail">› bed.wave [at] gmail [dot] com</span></div>
    </div>
  </aside>

  <script>
    // The entrance animation below sets a `transform`, which creates a CSS
    // stacking context on each nav group. Left in place, that would trap the
    // dog photo's z-index inside its own group, forever painting below any
    // group that comes later (e.g. Instagram/LinkedIn). Clearing the
    // transform once the animation finishes removes that stacking context
    // without changing how the entrance animation looks.
    document.querySelectorAll('.column > *').forEach((el) => {
      el.addEventListener('animationend', () => {
        el.style.animation = 'none';
        el.style.opacity = '1';
        el.style.transform = 'none';
      }, { once: true });
    });
  </script>
</body>
</html>
